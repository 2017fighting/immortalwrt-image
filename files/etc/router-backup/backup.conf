# router-backup 的非敏感默认值（随镜像分发；**不要**往这里写任何密钥）。
# 密钥写 /etc/router-backup/secrets.conf（0600，不进仓库，见
# secrets.conf.example）。
#
# 远端桶：Cloudflare R2，专用桶 + 只对本桶有 Object Read & Write 的令牌。
# endpoint 里的账户 ID 不是密钥（它同时写在 home-ops 的 terraform/backend.tf 里）。
R2_BUCKET=router-backup
R2_ENDPOINT=https://5f53ad3c8be24cd8ab64dc0fea85c9bc.r2.cloudflarestorage.com

# daily/ 滚动保留天数；monthly/ 保留天数（约 6 个月各一份，见 ADR-0006）。
RETENTION_DAYS=14
MONTHLY_KEEP_DAYS=190

# 告警：失败才推（成功/跳过不打扰）。服务器带在 conf 里，device key 在 secrets。
BARK_SERVER=https://bark.raenzo.com
BARK_GROUP=router
